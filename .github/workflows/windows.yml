name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test the shared code
        if: matrix.arch == 'x64'
        run: dotnet test windows/tests/Beanotch.Core.Tests
      - name: Publish
        run: dotnet publish windows/src/Beanotch/Beanotch.csproj -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }} -o out/Beanotch
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = ([xml](Get-Content windows/src/Beanotch/Beanotch.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          & $iscc /DAppVersion=$version /DArch=${{ matrix.arch }} windows/installer/Beanotch.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Beanotch-Setup-${{ matrix.arch }}
          path: out/Beanotch-Setup-${{ matrix.arch }}.exe
