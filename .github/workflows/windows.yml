name: Windows

on:
  push:
    paths: ["windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**"]
  workflow_dispatch:
  # Publishing a release (the Mac disk image) builds Windows at the same version and attaches its installers.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test the shared code
        if: matrix.arch == 'x64'
        run: dotnet test windows/tests/Beanotch.Core.Tests
      - name: Version
        shell: pwsh
        run: |
          $version = if ("${{ github.event_name }}" -eq "release") { "${{ github.event.release.tag_name }}".TrimStart("v") }
                     else { ([xml](Get-Content windows/src/Beanotch/Beanotch.csproj)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1 }
          "VERSION=$version" | Out-File -Append $env:GITHUB_ENV
      - name: Publish
        run: dotnet publish windows/src/Beanotch/Beanotch.csproj -c Release -r win-${{ matrix.arch }} -p:Platform=${{ matrix.arch }} -p:Version=${{ env.VERSION }} -o out/Beanotch
      - name: Resource files
        if: matrix.arch == 'x64'
        shell: pwsh
        run: |
          Get-ChildItem out/Beanotch -Recurse -Include *.pri, *.xbf, *.xaml | Format-Table FullName, Length -AutoSize | Out-String -Width 300
          "{0:N1} MB in {1} files" -f ((Get-ChildItem out/Beanotch -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), (Get-ChildItem out/Beanotch -Recurse -File).Count
          Get-ChildItem out/Beanotch -Recurse -File | Sort-Object Length -Descending | Select-Object -First 45 | Format-Table @{n='KB';e={[int]($_.Length/1KB)}}, FullName -AutoSize | Out-String -Width 300
          Get-ChildItem out/Beanotch -Directory | ForEach-Object { "{0,8} KB  {1}" -f [int]((Get-ChildItem $_.FullName -Recurse -File | Measure-Object Length -Sum).Sum / 1KB), $_.Name }
          Get-ChildItem obj -Recurse -Include *.pri -ErrorAction SilentlyContinue | Format-Table FullName, Length -AutoSize | Out-String -Width 300
          Get-ChildItem windows/src/Beanotch/obj -Recurse -Include *.pri | Format-Table FullName, Length -AutoSize | Out-String -Width 300
      # Runs the app on the build machine in its snapshot mode: it photographs the island and every page, then quits.
      - name: Snapshots
        if: matrix.arch == 'x64'
        continue-on-error: true
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "snapshots"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $env:BEANOTCH_SNAPSHOT = $dir
          $app = Start-Process out/Beanotch/Beanotch.exe -PassThru
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          # The idle notch (about 2 s in), the volume notice (5 s) and the open panel (10 s).
          $last = 0
          foreach ($at in 2, 5, 10) {
            Start-Sleep -Seconds ($at - $last)
            $last = $at
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $dir "00-desktop-$at`s.png"))
          }
          # The Glass theme's acrylic only shows on the real screen; the app says when it's open.
          $ready = Join-Path $dir "glass.ready"
          for ($i = 0; $i -lt 200 -and -not (Test-Path $ready); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $ready) {
            Start-Sleep -Seconds 2
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $dir "00-desktop-glass.png"))
          }
          $ready = Join-Path $dir "ruler.ready"
          for ($i = 0; $i -lt 120 -and -not (Test-Path $ready); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $ready) {
            Start-Sleep -Seconds 1
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $dir "00-desktop-ruler.png"))
          }
          if (-not $app.WaitForExit(240000)) { Stop-Process $app -Force; "timed out" | Out-File (Join-Path $dir "timeout.txt") }
          "exit code: $($app.ExitCode)" | Out-File (Join-Path $dir "exit.txt")
          Get-ChildItem $dir | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        if: always() && matrix.arch == 'x64'
        with:
          name: Beanotch-Snapshots
          path: ${{ runner.temp }}/snapshots
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc /DAppVersion=${{ env.VERSION }} /DArch=${{ matrix.arch }} windows/installer/Beanotch.iss
      - uses: actions/upload-artifact@v4
        with:
          name: Beanotch-Setup-${{ matrix.arch }}
          path: out/Beanotch-Setup-${{ matrix.arch }}.exe
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" "out/Beanotch-Setup-${{ matrix.arch }}.exe" --clobber --repo ${{ github.repository }}
